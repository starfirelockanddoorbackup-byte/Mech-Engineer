<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FUTURELAB // Mech Lab</title>
<style>
:root{--bg:#050811;--pn:#0c1222;--bd:#1e293b;--cy:#00d2ff;--wn:#f43f5e;--am:#fbbf24;--gr:#34d399;--tx:#f8fafc;--mu:#94a3b8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"IBM Plex Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans)}
body{background-image:radial-gradient(rgba(0,210,255,.1) 1px,transparent 1px);background-size:24px 24px;padding-bottom:84px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.mono{font-family:var(--mono)}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#050811f2;border-bottom:1px solid var(--bd);backdrop-filter:blur(6px)}
.tag{font:700 10px var(--mono);color:var(--cy);border:1px solid #00d2ff66;background:#00d2ff14;padding:2px 7px;border-radius:4px}
h1{font:800 14px var(--mono);letter-spacing:.08em;margin:0 0 0 8px}
h1 span{color:var(--cy);font-size:11px}
.wrap{max-width:980px;margin:0 auto;padding:10px 12px}
.grid2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.grid2>*{min-width:0}html,body{overflow-x:hidden}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.viewcol{position:sticky;top:54px}}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px;box-shadow:0 0 15px rgba(0,210,255,.08)}
.viewcol{position:sticky;top:46px;z-index:20}
@media(max-width:899px){.viewcol{margin:0 -12px;border-radius:0}.viewcol .panel{border-radius:0;border-left:0;border-right:0;padding:8px 10px}}
.view{position:relative;height:min(40vh,380px);border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0f1d38,#050811 75%)}
@media(min-width:900px){.view{height:440px}}
#cv{width:100%;height:100%;display:block;touch-action:none}
.vtools{position:absolute;top:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vt{font:700 10px var(--mono);background:#050811cc;border:1px solid var(--bd);color:var(--mu);padding:6px 8px;border-radius:6px}
.vt.on{color:var(--bg);background:var(--cy);border-color:var(--cy)}
.vbadge{position:absolute;left:8px;top:8px;font:700 10px var(--mono);padding:4px 7px;border-radius:5px;background:#050811cc;border:1px solid var(--bd)}
.vname{position:absolute;left:8px;bottom:8px;font:700 11px var(--mono);color:var(--cy);text-shadow:0 0 8px #00d2ff88}
.vhint{position:absolute;right:8px;bottom:8px;font:10px var(--mono);color:#64748b}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.bar b{overflow:hidden;display:flex;justify-content:space-between;font:700 9.5px var(--mono);color:var(--mu);margin-bottom:3px;white-space:nowrap}
.bar b i{font-style:normal;color:var(--tx)}
.bar .t{height:7px;background:#050811;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.bar .t>div{height:100%;background:var(--cy);transition:width .25s,background .25s}
.tabs{display:flex;gap:6px;margin:12px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;font:800 11px var(--mono);letter-spacing:.06em;padding:10px 8px;border-radius:8px;background:var(--pn);border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.tab.on{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.slot{background:#050811;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.slot.warn{border-color:#f43f5e88}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh .l{font:700 9.5px var(--mono);letter-spacing:.12em;color:var(--mu)}
.sh .n{font-weight:800;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:700 12px var(--sans);padding:8px 11px;border-radius:7px;background:#00d2ff0d;border:1px solid #00d2ff40;color:var(--tx)}
.chip.on{background:var(--cy);color:var(--bg);border-color:var(--cy);box-shadow:0 0 12px #00d2ff55}
.chip.sw{width:34px;height:34px;padding:0;border-radius:50%}
.spec{font:11px var(--mono);color:var(--mu);margin-top:6px;line-height:1.5}
.spec em{font-style:normal;color:var(--cy)}
.note{font-size:12.5px;color:#cbd5e1;margin-top:6px;line-height:1.45;border-left:2px solid #00d2ff55;padding-left:8px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.met{background:#050811;border:1px solid var(--bd);border-radius:10px;padding:10px}
.met .k{font:700 9.5px var(--mono);letter-spacing:.1em;color:var(--mu)}
.met .v{font:800 20px var(--mono);margin:3px 0}
.met .s{font-size:11.5px;color:#94a3b8;line-height:1.4}
.met.bad .v{color:var(--wn)}.met.ok .v{color:var(--gr)}.met.mid .v{color:var(--am)}
.warns{margin-top:10px}
.w{display:flex;gap:8px;padding:9px 10px;border-radius:8px;margin-bottom:6px;font-size:13px;line-height:1.4;background:#f43f5e14;border:1px solid #f43f5e55}
.w.y{background:#fbbf2412;border-color:#fbbf2455}.w.g{background:#34d39912;border-color:#34d39955}
.w b{font-family:var(--mono);font-size:11px}
details{background:#050811;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
summary{list-style:none;padding:12px;font-weight:800;font-size:14px;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--cy);font-family:var(--mono)}
details[open] summary::after{content:"–"}
details .b{padding:0 12px 12px;font-size:13.5px;line-height:1.55;color:#cbd5e1}
details .b .eq{font:12px var(--mono);color:var(--cy);background:#00d2ff0d;padding:6px 8px;border-radius:6px;margin:6px 0;display:block}
details .b .yours{font:12px var(--mono);color:var(--am);margin-top:6px;display:block}
.btn{font:800 12px var(--mono);letter-spacing:.05em;padding:11px 12px;border-radius:9px;background:var(--pn);border:1px solid var(--bd);color:var(--tx)}
.btn.cy{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.save{display:flex;align-items:center;gap:8px;background:#050811;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.save .i{flex:1;min-width:0}.save .i b{display:block;font-size:14px}.save .i span{font:11px var(--mono);color:var(--mu)}
textarea{width:100%;min-height:90px;background:#050811;border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:12px var(--mono);padding:8px;margin-top:8px}
.go{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#050811 30%)}
.go button{width:100%;max-width:980px;margin:0 auto;display:block;padding:15px;border-radius:12px;border:0;background:var(--cy);color:var(--bg);font:900 14px var(--mono);letter-spacing:.06em;box-shadow:0 0 24px #00d2ff44}
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:90;background:#0c1222;border:1px solid var(--cy);color:var(--tx);padding:9px 14px;border-radius:8px;font:700 12px var(--mono);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* test range */
#range{position:fixed;inset:0;z-index:80;background:#03050b;display:none;flex-direction:column}
#range.on{display:flex}
#rcv{flex:1;width:100%;min-height:0;display:block;touch-action:none}
.rtop{position:absolute;left:0;right:0;top:0;padding:10px 12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.rst{font:800 11px var(--mono);letter-spacing:.1em;color:var(--cy)}
.rst big{display:block;font-size:18px;color:var(--tx);letter-spacing:.04em;margin-top:2px}
.rx{pointer-events:auto}
.rhud{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rh{background:#050811d0;border:1px solid var(--bd);border-radius:8px;padding:6px 7px}
.rh b{display:block;font:700 9px var(--mono);color:var(--mu);letter-spacing:.08em}
.rh i{display:block;font:800 14px var(--mono);font-style:normal;margin-top:2px}
.rh .t{height:4px;background:#1e293b;border-radius:2px;margin-top:4px;overflow:hidden}.rh .t div{height:100%;background:var(--cy)}
.ralert{position:absolute;left:0;right:0;top:34%;text-align:center;font:900 22px var(--mono);letter-spacing:.06em;text-shadow:0 0 16px currentColor;pointer-events:none;opacity:0;transition:opacity .2s}
#report{position:absolute;inset:0;overflow-y:auto;background:#050811f4;display:none;padding:16px 14px calc(30px + env(safe-area-inset-bottom))}
#report.on{display:block}
.grade{font:900 72px var(--mono);text-align:center;line-height:1;margin:6px 0 2px;text-shadow:0 0 30px currentColor}
.rrow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px dashed var(--bd);font-size:13.5px}
.rrow span:last-child{font-family:var(--mono);font-weight:700}
.pf{font:800 10px var(--mono);padding:2px 6px;border-radius:4px;margin-left:6px}
.pf.p{background:#34d39933;color:var(--gr)}.pf.f{background:#f43f5e33;color:var(--wn)}.pf.m{background:#fbbf2433;color:var(--am)}
h3{font:800 12px var(--mono);letter-spacing:.12em;color:var(--mu);margin:16px 0 8px}
footer{text-align:center;font:10px var(--mono);color:#475569;padding:18px 0 8px}
</style>
</head>
<body>
<header><div style="display:flex;align-items:center"><span class="tag">FUTURELAB // R&amp;D</span><h1>MECH LAB <span>// SYS.02</span></h1></div><button class="btn" style="padding:7px 10px;font-size:10px" onclick="tabTo('hangar')">HANGAR</button></header>
<div class="wrap">
 <div class="grid2">
  <div class="viewcol"><div class="panel">
   <div class="view"><canvas id="cv"></canvas>
    <div class="vbadge mono" id="badge">OPTIMAL</div>
    <div class="vtools"><button class="vt on" id="t-rot" onclick="tog('rot')">SPIN</button><button class="vt" id="t-xray" onclick="tog('xray')">X-RAY</button><button class="vt on" id="t-cog" onclick="tog('cog')">CoG</button></div>
    <div class="vname" id="vname"></div><div class="vhint">drag · pinch</div>
   </div>
   <div class="bars">
    <div class="bar"><b>MASS <i id="bm-l"></i></b><div class="t"><div id="bm"></div></div></div>
    <div class="bar"><b>POWER <i id="bp-l"></i></b><div class="t"><div id="bp"></div></div></div>
    <div class="bar"><b>HEAT <i id="bh-l"></i></b><div class="t"><div id="bh"></div></div></div>
   </div>
  </div></div>
  <div>
   <div class="tabs"><button class="tab on" data-t="build" onclick="tabTo('build')">BUILD</button><button class="tab" data-t="stats" onclick="tabTo('stats')">ANALYSIS</button><button class="tab" data-t="learn" onclick="tabTo('learn')">LEARN</button><button class="tab" data-t="hangar" onclick="tabTo('hangar')">HANGAR</button></div>
   <div id="p-build"></div>
   <div id="p-stats" hidden></div>
   <div id="p-learn" hidden></div>
   <div id="p-hangar" hidden></div>
  </div>
 </div>
 <footer>FUTURELAB R&amp;D DIVISION // VIRTUAL MECH WORKBENCH v1.0 // simplified physics for learning</footer>
</div>
<div class="go"><button onclick="startRange()">▶ RUN TEST RANGE</button></div>
<div class="toast" id="toast"></div>

<div id="range">
 <canvas id="rcv"></canvas>
 <div class="rtop"><div class="rst" id="rstage">STAGE 1/3<big>MOBILITY COURSE</big></div><button class="btn rx" onclick="endRange(true)">ABORT</button></div>
 <div class="ralert" id="ralert"></div>
 <div class="rhud">
  <div class="rh"><b>SPEED</b><i id="h-spd">0</i></div>
  <div class="rh"><b>HEAT</b><i id="h-heat">0%</i><div class="t"><div id="h-heatb"></div></div></div>
  <div class="rh"><b>HITS</b><i id="h-hits">0/0</i></div>
  <div class="rh"><b>INTEGRITY</b><i id="h-hp">100%</i><div class="t"><div id="h-hpb"></div></div></div>
 </div>
 <div id="report"></div>
</div>

<script>
"use strict";
/* =====================================================================
   DATA — chassis & parts. Numbers are simplified but follow real trends.
   mass t, pw = power draw MW, ht = heat MW while working, cost kCr

  d:'Big two-legged frame. Carries the most guns of any walker.',note:'Twice the size does not mean twice the strength: see the Square-Cube Law in LEARN.'},

  d:'Tank treads instead of legs. Low, tough, spreads its weight.',note:'Tank tracks spread weight over a long strip of ground, which is why a 60-tonne tank can cross soft ground that would trap a truck.'}

 hand:{n:'Manipulator Hand',m:2,pw:1,ht:0,dmg:0,rof:0,rng:0,rec:0,acc:0,cost:20,d:'Grabs and carries. No weapon.',note:'Robot hands with many joints need precise motors and sensors, which is why they are some of the hardest parts in robotics.'},

 rockets:{n:'Hornet Rocket Pod',m:8,pw:3,ht:12,dmg:60,rof:2,rng:1600,rec:3,acc:.6,cost:240,d:'Unguided rockets. Low recoil because the rocket pushes itself.',note:'Rockets carry their own motor, so almost no recoil reaches the launcher.'},
 claw:{n:'Hydraulic Crusher',m:7,pw:15,ht:4,dmg:120,rof:.8,rng:8,rec:0,acc:1,cost:150,d:'Giant crushing claw. Melee only.',note:'Hydraulics multiply force: a small piston pushing on fluid can drive a big piston with far more force (Pascal’s principle).'},
 shield:{n:'Riot Shield',m:12,pw:0,ht:0,dmg:0,rof:0,rng:0,rec:0,acc:0,arm:90,cost:140,d:'Huge armored plate. Blocks fire on this side.',note:'Sloped armor makes incoming rounds travel through more metal, a trick used on tanks since WWII.'}
};
const SHO={ // shoulder pods
 none:{n:'Empty',m:0,pw:0,ht:0,cost:0,d:'Nothing mounted.',note:'Every tonne you don’t carry is speed and stability.'},
 missile:{n:'LRM Missile Rack',m:9,pw:6,ht:14,dmg:90,rof:.6,rng:5000,rec:1,acc:.7,cost:420,wpn:1,d:'Guided missiles, longest direct range.',note:'Guided missiles steer themselves, so accuracy depends on their sensors more than the launcher.'},
 mortar:{n:'Mortar Tube',m:8,pw:2,ht:8,dmg:140,rof:.3,rng:3000,rec:6,acc:.5,cost:180,wpn:1,d:'Lobs shells high. Big hits, slow, inaccurate.',note:'Mortars fire in an arc: the shell trades speed for height and comes down on targets behind cover.'},
 radar:{n:'Radar Dome',m:3,pw:18,ht:6,cost:300,acc:.2,d:'Finds targets: +20% accuracy for every weapon.',note:'Radar measures distance by timing radio echoes travelling at the speed of light.'},
 shieldgen:{n:'Aegis Shield Gen',m:9,pw:60,ht:25,cost:650,shield:300,d:'Energy barrier absorbs 300 damage. Power hungry.',note:'Sci-fi part! The engineering lesson is real though: every system that runs all the time costs power and makes heat.'},
 ecm:{n:'ECM Mast',m:2,pw:12,ht:4,cost:260,ecm:.3,d:'Jams enemy targeting: 30% fewer hits taken.',note:'Electronic countermeasures flood enemy sensors with noise or fake signals.'},
 light:{n:'Floodlights',m:1,pw:2,ht:1,cost:30,d:'Looks cool. Helps at night. Almost free.',note:'LEDs turn far more of their power into light than old filament bulbs, which waste most of it as heat.'}

const ARM={ // armor: t per m2 of frame surface, rating

 reactive:{n:'Reactive Blocks',den:.34,ar:88,cost:520,d:'Explosive tiles blast incoming shots apart.',note:'Real reactive armor uses small explosive bricks that detonate outward to disrupt incoming rockets.'}

const RX={ // reactors

  // tracers & particles
  rx.lineCap='round';for(const tr of R.tracers){const A=toV(tr.a),Bv=toV(tr.b);if(A[2]<.3||Bv[2]<.3)continue;const p=pr(A),q=pr(Bv);rx.strokeStyle=tr.c;rx.globalAlpha=Math.min(1,tr.l*8);rx.lineWidth=tr.w;rx.shadowColor=tr.c;rx.shadowBlur=8;rx.beginPath();rx.moveTo(p[0],p[1]);rx.lineTo(q[0],q[1]);rx.stroke()}rx.shadowBlur=0;rx.globalAlpha=1;
  for(const p of R.parts){const v=toV([p.x,p.y,p.z]);if(v[2]<.3)continue;const s=pr(v);rx.fillStyle=p.c;rx.globalAlpha=Math.min(1,p.l*2);rx.fillRect(s[0]-2,s[1]-2,4,4)}rx.globalAlpha=1;
  // labels
  rx.font='700 10px ui-monospace,monospace';rx.textAlign='center';
  if(R.stage===1)for(const s of R.segs){const v=toV([12,0,(s.z0+s.z1)/2]);if(v[2]<.3)continue;const p=pr(v);rx.fillStyle='#cbd5e1';rx.fillText(s.s[0],p[0],p[1]);rx.fillStyle='#64748b';rx.fillText(`holds ${fmt(s.s[1])} kPa`,p[0],p[1]+12)}
  if(R.stage>=2)for(const t of R.targets){const v=toV([t.x,t.sz*3.2,t.z]);if(v[2]<.3)continue;const p=pr(v);rx.fillStyle=t.hp>0?'#f8fafc':'#475569';rx.fillText(`${fmt(t.d)} m`,p[0],p[1]);if(t.hp>0){rx.fillStyle='#1e293b';rx.fillRect(p[0]-16,p[1]+4,32,4);rx.fillStyle='#f43f5e';rx.fillRect(p[0]-16,p[1]+4,32*t.hp/t.mx,4)}}
  if(R.stage===3&&R.shield>0){const v=toV([0,c.hip+1,R.z]);if(v[2]>.3){const p=pr(v);rx.strokeStyle='rgba(122,216,255,.5)';rx.lineWidth=2;rx.beginPath();rx.arc(p[0],p[1],Math.min(RW,RH)*.22,0,7);rx.stroke()}}
  if(R.shock>0){const v=toV([0,.2,R.z]);if(v[2]>.3){const p=pr(v);rx.strokeStyle=`rgba(255,180,74,${R.shock})`;rx.lineWidth=3;rx.beginPath();rx.ellipse(p[0],p[1],(1-R.shock)*RW*.8,(1-R.shock)*RH*.15,0,0,7);rx.stroke()}}
 });
 if(R.shut>0){rx.fillStyle=`rgba(251,191,36,${.08+.06*Math.sin(R.t*12)})`;rx.fillRect(0,0,RW,RH)}}
function report(){const a=AN,el=$('report');const acc=R.shots?R.hits/R.shots:0,kills=R.targets.filter(t=>t.hp<=0).length,avgV=R.spdN?R.spdSum/R.spdN:0;
 const pass=(ok,mid)=>ok?'<span class="pf p">PASS</span>':mid?'<span class="pf m">WEAK</span>':'<span class="pf f">FAIL</span>';
 const mob=!R.buckle&&R.bog===0&&R.slopeOK!==false,mobMid=!R.buckle&&R.bog<=1;
 const fireOK=kills>=3&&R.shutN===0,fireMid=kills>=2;
 const surv=R.hp>45&&!R.shockFell,survMid=R.hp>20;
 let score=(mob?30:mobMid?18:5)+(fireOK?35:fireMid?20:kills*5)+(surv?30:survMid?15:5)+(a.status==='OPTIMAL'?5:0);
 const grade=score>=95?'S':score>=82?'A':score>=68?'B':score>=52?'C':score>=36?'D':'F';LAST_GRADE=grade;
 const gc={S:'#00d2ff',A:'#34d399',B:'#a3e635',C:'#fbbf24',D:'#fb923c',F:'#f43f5e'}[grade];
 const fixes=[];if(R.buckle)fixes.push('The frame was overloaded and buckled. Cut mass or pick a stronger chassis.');
 if(R.bog)fixes.push(`Sank in soft ground (${a.walkP.toFixed(0)} kPa walking). Wide pads or tracks spread the load.`);
 if(R.slopeOK===false)fixes.push('Slipped on the 20° slope. Lower the CoG, widen the stance, or fit spiked grips / gyro.');
 if(R.shutN)fixes.push(`Overheated ${R.shutN}×. Add cooling or swap hot weapons (laser/railgun) for cooler ones.`);
 if(kills<3&&R.wl.length)fixes.push(a.maxRng<1800?'Targets out past your range. Longer-range weapons reach the far targets.':'Low hit rate. Heavier frames steady recoil; radar boosts accuracy.');
 if(!R.wl.length)fixes.push('No weapons fitted, so nothing could be scored on the firing line.');
 if(R.shockFell)fixes.push(`Knocked over by the shockwave (tips at ${a.tipDeg.toFixed(0)}°). Balance the arms and lower heavy parts.`);
 if(R.hp<45)fixes.push('Took heavy damage. Better armor, a shield generator or ECM.');
 if(a.pwrRatio>1)fixes.push('Brownouts slowed everything. The reactor is too small for this loadout.');
 if(!fixes.length)fixes.push('Nothing to fix. Try a harder build, or chase an S on a cheaper mech!');
 el.innerHTML=`<div class="rst" style="text-align:center">TEST COMPLETE // ${CH[B.chassis].n.toUpperCase()}</div><div class="grade" style="color:${gc}">${grade}</div><div style="text-align:center;font:700 12px ui-monospace,monospace;color:#94a3b8">SCORE ${score}/100</div>
 <h3>1 // MOBILITY ${pass(mob,mobMid)}</h3>
 <div class="rrow"><span>Average speed</span><span>${avgV.toFixed(0)} km/h <span style="color:#64748b">(rated ${a.speed.toFixed(0)})</span></span></div>
 ${SOILS.map(s=>{const l=R.soilLog[s[0]];if(!l)return'';const v=l.t?l.d/l.t*3.6:0;return`<div class="rrow"><span>${s[0]}</span><span style="color:${a.walkP>s[1]?'#fbbf24':'#34d399'}">${v.toFixed(0)} km/h${a.walkP>s[1]?' · sank':''}</span></div>`}).join('')}
 <div class="rrow"><span>Slope (20°)</span><span>${R.slopeOK===null?'not reached':R.slopeOK?'climbed':'slipped'}</span></div>
 <h3>2 // LIVE FIRE ${pass(fireOK,fireMid)}</h3>
 <div class="rrow"><span>Targets destroyed</span><span>${kills} / 5</span></div>
 <div class="rrow"><span>Hit rate</span><span>${Math.round(acc*100)}% (${R.hits}/${R.shots})</span></div>
 <div class="rrow"><span>Damage dealt</span><span>${fmt(R.dmg)}</span></div>
 <div class="rrow"><span>Peak heat</span><span style="color:${R.peakHeat>=100?'#f43f5e':'#e2e8f0'}">${Math.round(Math.min(R.peakHeat,100))}%${R.shutN?` · ${R.shutN} shutdown${R.shutN>1?'s':''}`:''}</span></div>
 <h3>3 // STRESS ${pass(surv,survMid)}</h3>
 <div class="rrow"><span>Integrity left</span><span>${Math.round(R.hp)}%</span></div>
 <div class="rrow"><span>Shockwave</span><span>${R.shockFell?'knocked down':'stood firm'}</span></div>
 <h3>ENGINEER'S NOTES</h3>${fixes.map(f=>`<div class="w y"><div>${f}</div></div>`).join('')}
 <div class="row" style="margin-top:14px"><button class="btn" onclick="startRange()">RE-RUN</button><button class="btn cy" onclick="endRange(true)">BACK TO WORKBENCH</button></div>
 <div class="row" style="margin-top:8px"><button class="btn" onclick="endRange(true);tabTo('hangar');saveB()">SAVE THIS BUILD</button></div>`;
 el.classList.add('on');el.scrollTop=0}

/* =====================================================================
   BOOT
   ===================================================================== */
try{const s=JSON.parse(localStorage.getItem('mechlab.cur')||'null');if(s)for(const[k,,tab]of SLOTS)if(s[k]&&tab[s[k]])B[k]=s[k]}catch(e){}
AN=analyze(B);renderBuild();renderStats();renderLearn();renderHangar();updateBars();
addEventListener('resize',()=>{fit();if(R&&!R.done)rfit()});fit();
(function loop(){tick+=1/60;try{drawBench()}catch(e){console.error(e)}requestAnimationFrame(loop)})();
</script>
